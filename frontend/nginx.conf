# Two front doors onto the same backend: 9998 is where people search and
# request songs, 9999 is the shared display/speaker that actually plays them.
#
# proxy_pass below uses a variable (not a literal hostname) specifically so
# nginx re-resolves "jam-backend" through Docker's embedded DNS on every
# request instead of caching whatever IP it got at nginx's own startup —
# otherwise a backend container restart/recreate (a new IP) leaves nginx
# stuck proxying to a dead address until nginx itself is restarted too.
resolver 127.0.0.11 valid=10s;

server {
    listen 9998;
    root /usr/share/nginx/html;
    index request.html;
    location /api/ {
        # A variable in proxy_pass (needed above for dynamic re-resolution)
        # disables nginx's usual automatic "strip the location prefix"
        # behavior, so the /api/ prefix has to be stripped explicitly here.
        # set must come before rewrite ... break — break halts processing
        # of any later rewrite-module directive (set included) in this
        # location, so a set placed after it would silently never run.
        set $upstream http://jam-backend:5000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
    location / {
        add_header Cache-Control "no-cache" always;
        try_files /request.html =404;
    }
}

server {
    listen 9999;
    root /usr/share/nginx/html;
    index player.html;
    location /api/ {
        # set must come before rewrite ... break — break halts processing
        # of any later rewrite-module directive (set included) in this
        # location, so a set placed after it would silently never run.
        set $upstream http://jam-backend:5000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
    # The actual shared invite link (e.g. http://<lan-ip>:9999/invite/<token>)
    # — no /api/ prefix here since this is the public-facing URL itself, not
    # an internal API call. No rewrite needed either: with nothing to strip,
    # the variable-based proxy_pass already forwards the URI unchanged.
    location /invite/ {
        set $upstream http://jam-backend:5000;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        # $http_host (unlike $host) keeps whatever port the browser actually
        # sent — the backend needs that to redirect from :9999 to :9998 on
        # whatever hostname/IP someone is actually browsing from.
        proxy_set_header X-Forwarded-Host $http_host;
    }
    location / {
        add_header Cache-Control "no-cache" always;
        try_files /player.html =404;
    }
}
