<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jamidrome</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0d12;--bg2:#13131a;--bg3:#1a1a24;--bg4:#22222e;
  --border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.14);
  --sp:#1ed760;--nd:#8b5cf6;
  --text:#f0f0f8;--text2:#9090b0;--text3:#5a5a7a;
  --font:'Inter',sans-serif;--font2:'Space Grotesk',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:var(--font);height:100%;overflow:hidden}
body::before{content:'';position:fixed;inset:0;
  background-image:radial-gradient(circle at 15% 15%, rgba(30,215,96,.07) 0%, transparent 45%),
    radial-gradient(circle at 85% 85%, rgba(139,92,246,.07) 0%, transparent 45%);
  pointer-events:none}

.stage{position:relative;z-index:1;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px;text-align:center}
.logo{position:fixed;top:24px;left:32px;font-family:var(--font2);font-size:17px;font-weight:700;letter-spacing:-.5px;opacity:.6}
.logo .j{color:var(--sp)}.logo .arr{color:var(--text3);margin:0 3px;font-weight:400}.logo .d{color:var(--nd)}

#overlay{position:fixed;inset:0;background:var(--bg);z-index:10;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;cursor:pointer}
#overlay .big{font-family:var(--font2);font-size:38px;font-weight:700}
#overlay .sub{color:var(--text2);font-size:14px}
#overlay .btn{background:var(--sp);color:#06210f;border:none;border-radius:40px;padding:16px 36px;font-size:16px;font-weight:700;cursor:pointer}

.art-wrap{width:min(38vh,320px);height:min(38vh,320px);border-radius:20px;overflow:hidden;background:var(--bg3);box-shadow:0 30px 80px rgba(0,0,0,.5);margin-bottom:28px}
.art-wrap img{width:100%;height:100%;object-fit:cover;display:block}
.title{font-family:var(--font2);font-size:clamp(20px,4vw,36px);font-weight:700;max-width:900px}
.artist{color:var(--text2);font-size:clamp(13px,1.6vw,18px);margin-top:8px}
.req{color:var(--text3);font-size:12px;margin-top:4px}

.bar-wrap{width:min(70vw,520px);margin-top:26px}
.bar{height:5px;background:var(--bg4);border-radius:3px;overflow:hidden}
.bar-fill{height:100%;background:linear-gradient(90deg,var(--sp),var(--nd));width:0%;transition:width .3s linear}
.times{display:flex;justify-content:space-between;font-size:11px;color:var(--text3);margin-top:6px}

.idle .big{font-family:var(--font2);font-size:32px;font-weight:700;color:var(--text2)}
.idle .hint{margin-top:12px;font-size:15px;color:var(--text3)}
.idle .hint b{color:var(--sp)}

.up-next{position:fixed;bottom:24px;left:0;right:0;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:0 24px}
.un-item{display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:6px 12px 6px 6px;max-width:220px}
.un-item img{width:30px;height:30px;border-radius:6px;object-fit:cover;flex-shrink:0}
.un-item .t{font-size:11.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.un-item .s{font-size:10px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

#skip-btn{position:fixed;top:22px;right:28px;background:var(--bg3);border:1px solid var(--border);color:var(--text2);border-radius:20px;padding:8px 16px;font-size:12px;font-weight:600;cursor:pointer}
#skip-btn:hover{color:var(--text)}
#invite-btn{position:fixed;top:22px;left:28px;background:var(--bg3);border:1px solid var(--border);color:var(--text2);border-radius:20px;padding:8px 16px;font-size:12px;font-weight:600;cursor:pointer;z-index:5}
#invite-btn:hover{color:var(--text)}

#invite-modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:none;align-items:center;justify-content:center}
#invite-modal.show{display:flex}
.im-card{background:var(--bg2);border:1px solid var(--border2);border-radius:16px;padding:22px 24px;width:min(90vw,420px);text-align:left;max-height:85vh;overflow-y:auto}
.im-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.im-hd h3{font-family:var(--font2);font-size:17px}
.im-close{background:none;border:none;color:var(--text3);font-size:18px;cursor:pointer}
.im-row{display:flex;gap:8px;margin-bottom:10px}
.im-row select{flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:9px 10px;color:var(--text);font-size:13px;outline:none}
.im-row button{background:var(--sp);color:#06210f;border:none;border-radius:8px;padding:9px 14px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.im-link-row{display:none;gap:6px;margin-bottom:16px}
.im-link-row input{flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:9px 10px;color:var(--text2);font-size:12px;outline:none}
.im-link-row button{background:var(--bg4);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:0 12px;font-size:12px;cursor:pointer}
.im-sec-title{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;font-weight:500;margin:14px 0 8px}
.im-list{display:flex;flex-direction:column;gap:6px}
.im-item{display:flex;align-items:center;gap:8px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:7px 10px;font-size:11.5px}
.im-item .exp{color:var(--text3);flex:1}
.im-item button{background:none;border:none;color:var(--text3);cursor:pointer;font-size:14px}
.im-item button:hover{color:#f87171}
.im-empty{color:var(--text3);font-size:12px;padding:6px 2px}
</style>
</head>
<body>
<div id="overlay">
  <div class="big"><span style="color:var(--sp)">Jam</span><span style="color:var(--text3)">→</span><span style="color:var(--nd)">Drome</span></div>
  <div class="sub">Click anywhere to start the jam</div>
  <button class="btn" onclick="startJam()">▶ Start</button>
</div>

<div class="logo"><span class="j">Jam</span><span class="arr">→</span><span class="d">Drome</span></div>
<button id="skip-btn" onclick="skip()" style="display:none">⏭ Skip</button>
<button id="invite-btn" onclick="openInvite()">🔗 Invite</button>

<div id="invite-modal">
  <div class="im-card">
    <div class="im-hd"><h3>Share the Jam</h3><button class="im-close" onclick="closeInvite()">✕</button></div>
    <div class="im-row">
      <select id="ttl-select">
        <option value="900">15 minutes</option>
        <option value="1800">30 minutes</option>
        <option value="3600">1 hour</option>
        <option value="10800" selected>3 hours</option>
        <option value="21600">6 hours</option>
        <option value="86400">24 hours</option>
      </select>
      <button onclick="generateInvite()">Generate</button>
    </div>
    <div class="im-link-row" id="im-link-row">
      <input id="im-link" readonly>
      <button onclick="copyInvite()">Copy</button>
    </div>
    <div class="im-sec-title">Active Links</div>
    <div class="im-list" id="im-list"><div class="im-empty">None yet</div></div>
  </div>
</div>

<div class="stage">
  <div id="playing-view" style="display:none">
    <div class="art-wrap"><img id="art" src=""></div>
    <div class="title" id="title"></div>
    <div class="artist" id="artist"></div>
    <div class="req" id="req"></div>
    <div class="bar-wrap">
      <div class="bar"><div class="bar-fill" id="bar-fill"></div></div>
      <div class="times"><span id="t-elapsed">0:00</span><span id="t-total">0:00</span></div>
    </div>
  </div>
  <div id="idle-view" class="idle">
    <div class="big">Waiting for requests…</div>
    <div class="hint">Add a song at <b id="host-hint"></b></div>
  </div>
</div>

<div class="up-next" id="up-next"></div>

<audio id="audio"></audio>

<script>
const API = '/api';
const audio = document.getElementById('audio');
(async () => {
  const hint = document.getElementById('host-hint');
  hint.textContent = `${location.hostname}:9998`; // fallback until /config resolves (or if it fails)
  try{
    const r = await fetch(`${API}/config`);
    const d = await r.json();
    if(d.request_page_url) hint.textContent = new URL(d.request_page_url).host;
  }catch(e){}
})();

function startJam(){
  document.getElementById('overlay').style.display = 'none';
  // Register the user gesture with a silent play/pause so later
  // programmatic .play() calls aren't blocked by autoplay policy.
  audio.muted = false;
  audio.play().catch(()=>{});
  poll();
}

function fmt(s){s=Math.max(0,Math.round(s||0));return`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

let currentId = null;
let barTimer = null;

async function poll(){
  try{
    const r = await fetch(`${API}/player/state`);
    const d = await r.json();
    render(d);
  }catch(e){}
  setTimeout(poll, 1000);
}

function render(d){
  const np = d.now_playing;
  document.getElementById('playing-view').style.display = np ? 'block' : 'none';
  document.getElementById('idle-view').style.display = np ? 'none' : 'block';
  document.getElementById('skip-btn').style.display = np ? 'block' : 'none';

  if(np){
    if(np.id !== currentId){
      currentId = np.id;
      document.getElementById('art').src = np.thumbnail || '';
      document.getElementById('title').textContent = np.title;
      document.getElementById('artist').textContent = np.artist;
      document.getElementById('req').textContent = `requested by ${np.requested_by}`;
      document.getElementById('t-total').textContent = fmt(np.duration);
      audio.src = np.stream_url;
      audio.play().catch(()=>{});
    }
    const elapsed = d.playback_started_at ? (Date.now()/1000 - d.playback_started_at) : 0;
    const pct = np.duration ? Math.min(100, elapsed/np.duration*100) : 0;
    document.getElementById('bar-fill').style.width = pct + '%';
    document.getElementById('t-elapsed').textContent = fmt(elapsed);
  } else {
    currentId = null;
    audio.pause();
    audio.removeAttribute('src');
  }

  const un = document.getElementById('up-next');
  un.innerHTML = (d.up_next || []).slice(0, 6).map(i => `
    <div class="un-item">
      <img src="${esc(i.thumbnail)}">
      <div style="min-width:0">
        <div class="t">${esc(i.title)}</div>
        <div class="s">${i.status === 'downloading' ? '⬇ downloading…' : i.status === 'ready' ? '✅ ready' : '⏳ queued'}</div>
      </div>
    </div>`).join('');
}

audio.addEventListener('ended', () => { fetch(`${API}/player/advance`, {method:'POST'}); });
function skip(){ fetch(`${API}/player/advance`, {method:'POST'}); }

// ── Invite links ──────────────────────────────────────────────────────────
function fmtRemaining(expiresAt){
  const s = Math.max(0, Math.round(expiresAt - Date.now()/1000));
  if(s >= 3600) return `${Math.floor(s/3600)}h ${Math.floor((s%3600)/60)}m left`;
  return `${Math.floor(s/60)}m left`;
}

function openInvite(){
  document.getElementById('invite-modal').classList.add('show');
  document.getElementById('im-link-row').style.display = 'none';
  refreshInviteList();
}
function closeInvite(){ document.getElementById('invite-modal').classList.remove('show'); }

async function generateInvite(){
  const ttl_seconds = parseInt(document.getElementById('ttl-select').value, 10);
  try{
    const r = await fetch(`${API}/invite/create`, {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ttl_seconds})});
    const d = await r.json();
    if(!r.ok){ alert(d.error || 'Could not create link'); return; }
    // location.origin reflects however this page was actually reached —
    // raw :9999, or a reverse-proxied hostname with no port at all.
    const link = `${location.origin}${d.path}`;
    document.getElementById('im-link').value = link;
    document.getElementById('im-link-row').style.display = 'flex';
    refreshInviteList();
  }catch(e){ alert('Failed: ' + e.message); }
}

function copyInvite(){
  const el = document.getElementById('im-link');
  el.select();
  navigator.clipboard?.writeText(el.value).catch(()=>{});
  document.execCommand && document.execCommand('copy');
}

async function refreshInviteList(){
  try{
    const r = await fetch(`${API}/invite/list`);
    const d = await r.json();
    const list = document.getElementById('im-list');
    if(!d.invites || !d.invites.length){ list.innerHTML = '<div class="im-empty">None yet</div>'; return; }
    list.innerHTML = d.invites.map(inv => `
      <div class="im-item">
        <span class="exp">…${esc(inv.token.slice(-6))} · ${fmtRemaining(inv.expires_at)}</span>
        <button onclick="revokeInvite('${inv.token}')" title="Revoke">✕</button>
      </div>`).join('');
  }catch(e){}
}

async function revokeInvite(token){
  await fetch(`${API}/invite/${token}/revoke`, {method:'POST'});
  refreshInviteList();
}
</script>
</body>
</html>
