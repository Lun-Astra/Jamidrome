<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jamidrome</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0d12;--bg2:#13131a;--bg3:#1a1a24;--bg4:#22222e;
  --border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.14);
  --sp:#1ed760;--nd:#8b5cf6;
  --text:#f0f0f8;--text2:#9090b0;--text3:#5a5a7a;
  --font:'Inter',sans-serif;--font2:'Space Grotesk',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:var(--font);height:100%;overflow:hidden}
body::before{content:'';position:fixed;inset:0;
  background-image:radial-gradient(circle at 15% 15%, rgba(30,215,96,.07) 0%, transparent 45%),
    radial-gradient(circle at 85% 85%, rgba(139,92,246,.07) 0%, transparent 45%);
  pointer-events:none}

.stage{position:relative;z-index:1;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px;text-align:center}
.logo{position:fixed;top:24px;left:32px;font-family:var(--font2);font-size:17px;font-weight:700;letter-spacing:-.5px;opacity:.6}
.logo .j{color:var(--sp)}.logo .arr{color:var(--text3);margin:0 3px;font-weight:400}.logo .d{color:var(--nd)}

#overlay{position:fixed;inset:0;background:var(--bg);z-index:10;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;cursor:pointer}
#overlay .big{font-family:var(--font2);font-size:38px;font-weight:700}
#overlay .sub{color:var(--text2);font-size:14px}
#overlay .btn{background:var(--sp);color:#06210f;border:none;border-radius:40px;padding:16px 36px;font-size:16px;font-weight:700;cursor:pointer}

#playing-view{display:flex;flex-direction:column;align-items:center}
.art-wrap{width:min(38vh,320px);height:min(38vh,320px);border-radius:20px;overflow:hidden;background:var(--bg3);box-shadow:0 30px 80px rgba(0,0,0,.5);margin-bottom:28px;flex-shrink:0}
.art-wrap img{width:100%;height:100%;object-fit:cover;display:block}
.title{font-family:var(--font2);font-size:clamp(20px,4vw,36px);font-weight:700;max-width:900px}
.artist{color:var(--text2);font-size:clamp(13px,1.6vw,18px);margin-top:8px}
.req{color:var(--text3);font-size:12px;margin-top:4px}

.bar-wrap{width:min(70vw,520px);margin-top:26px}
.bar{height:5px;background:var(--bg4);border-radius:3px;overflow:hidden}
.bar-fill{height:100%;background:linear-gradient(90deg,var(--sp),var(--nd));width:0%;transition:width .3s linear}
.times{display:flex;justify-content:space-between;font-size:11px;color:var(--text3);margin-top:6px}

.idle .big{font-family:var(--font2);font-size:32px;font-weight:700;color:var(--text2)}
.idle .hint{margin-top:12px;font-size:15px;color:var(--text3)}
.idle .hint b{color:var(--sp)}

.up-next{position:fixed;bottom:24px;left:0;right:0;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:0 24px}
.un-item{display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:6px 12px 6px 6px;max-width:220px}
.un-item img{width:30px;height:30px;border-radius:6px;object-fit:cover;flex-shrink:0}
.un-item .t{font-size:11.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.un-item .s{font-size:10px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.un-item .dl-bar{height:4px;background:var(--bg4);border-radius:2px;margin-top:4px;overflow:hidden}
.un-item .dl-bar-fill{height:100%;background:linear-gradient(90deg,var(--sp),var(--nd));transition:width .4s linear}

.top-right{position:fixed;top:22px;right:28px;display:flex;align-items:center;gap:10px;z-index:5}
#skip-btn,#pause-btn{background:var(--bg3);border:1px solid var(--border);color:var(--text2);border-radius:20px;padding:8px 16px;font-size:12px;font-weight:600;cursor:pointer}
#skip-btn:hover,#pause-btn:hover{color:var(--text)}
.vol-ctrl{display:flex;align-items:center;gap:7px;background:var(--bg3);border:1px solid var(--border);border-radius:20px;padding:7px 14px}
.vol-ctrl button{background:none;border:none;color:var(--text2);font-size:14px;cursor:pointer;line-height:1}
.vol-ctrl button:hover{color:var(--text)}
.vol-ctrl input[type=range]{width:90px;accent-color:var(--sp);cursor:pointer}
#invite-btn{position:fixed;top:60px;left:28px;background:var(--bg3);border:1px solid var(--border);color:var(--text2);border-radius:20px;padding:8px 16px;font-size:12px;font-weight:600;cursor:pointer;z-index:5}
#invite-btn:hover{color:var(--text)}

#audio-unlock{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);display:none;
  background:var(--sp);color:#06210f;border:none;border-radius:24px;padding:12px 24px;
  font-size:14px;font-weight:700;cursor:pointer;z-index:15;box-shadow:0 10px 30px rgba(0,0,0,.4)}

#viz{width:min(70vw,520px);height:90px;margin:18px auto 0;display:block}

#invite-modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:none;align-items:center;justify-content:center}
#invite-modal.show{display:flex}
.im-card{background:var(--bg2);border:1px solid var(--border2);border-radius:16px;padding:22px 24px;width:min(90vw,420px);text-align:left;max-height:85vh;overflow-y:auto}
.im-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.im-hd h3{font-family:var(--font2);font-size:17px}
.im-close{background:none;border:none;color:var(--text3);font-size:18px;cursor:pointer}
.im-row{display:flex;gap:8px;margin-bottom:10px}
.im-row select{flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:9px 10px;color:var(--text);font-size:13px;outline:none}
.im-row button{background:var(--sp);color:#06210f;border:none;border-radius:8px;padding:9px 14px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.im-qr-wrap{display:none;justify-content:center;padding:14px 0 4px}
.im-qr-wrap img{width:180px;height:180px;border-radius:10px;background:#fff;padding:10px}
.im-link-row{display:none;gap:6px;margin-bottom:16px}
.im-link-row input{flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:9px 10px;color:var(--text2);font-size:12px;outline:none}
.im-link-row button{background:var(--bg4);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:0 12px;font-size:12px;cursor:pointer}
.im-sec-title{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;font-weight:500;margin:14px 0 8px}
.im-list{display:flex;flex-direction:column;gap:6px}
.im-item{display:flex;align-items:center;gap:8px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:7px 10px;font-size:11.5px}
.im-item .exp{color:var(--text3);flex:1}
.im-item button{background:none;border:none;color:var(--text3);cursor:pointer;font-size:14px}
.im-item button.im-revoke:hover{color:#f87171}
.im-item button.im-reopen:hover{color:var(--sp)}
.im-empty{color:var(--text3);font-size:12px;padding:6px 2px}
</style>
</head>
<body>
<div id="overlay">
  <div class="big"><span style="color:var(--sp)">Jam</span><span style="color:var(--text3)">→</span><span style="color:var(--nd)">Drome</span></div>
  <div class="sub">Click anywhere to start the jam</div>
  <button class="btn" onclick="startJam()">▶ Start</button>
</div>

<div class="logo"><span class="j">Jam</span><span class="arr">→</span><span class="d">Drome</span></div>
<div class="top-right">
  <div class="vol-ctrl">
    <button id="mute-btn" onclick="toggleMute()">🔊</button>
    <input type="range" id="vol-slider" min="0" max="100" value="100">
  </div>
  <button id="pause-btn" onclick="togglePause()" style="display:none">⏸ Pause</button>
  <button id="skip-btn" onclick="skip()" style="display:none">⏭ Skip</button>
</div>
<button id="invite-btn" onclick="openInvite()">🔗 Invite</button>
<button id="audio-unlock" onclick="tryPlay()">🔇 Tap to enable sound</button>

<div id="invite-modal">
  <div class="im-card">
    <div class="im-hd"><h3>Share the Jam</h3><button class="im-close" onclick="closeInvite()">✕</button></div>
    <div class="im-row">
      <select id="ttl-select">
        <option value="900">15 minutes</option>
        <option value="1800">30 minutes</option>
        <option value="3600">1 hour</option>
        <option value="10800" selected>3 hours</option>
        <option value="21600">6 hours</option>
        <option value="86400">24 hours</option>
      </select>
      <button onclick="generateInvite()">Generate</button>
    </div>
    <div class="im-qr-wrap" id="im-qr-wrap">
      <img id="im-qr" alt="Scan to join">
    </div>
    <div class="im-link-row" id="im-link-row">
      <input id="im-link" readonly>
      <button onclick="copyInvite()">Copy</button>
    </div>
    <div class="im-sec-title">Active Links</div>
    <div class="im-list" id="im-list"><div class="im-empty">None yet</div></div>
  </div>
</div>

<div class="stage">
  <div id="playing-view" style="display:none">
    <div class="art-wrap"><img id="art" src=""></div>
    <div class="title" id="title"></div>
    <div class="artist" id="artist"></div>
    <div class="req" id="req"></div>
    <div class="bar-wrap">
      <div class="bar"><div class="bar-fill" id="bar-fill"></div></div>
      <div class="times"><span id="t-elapsed">0:00</span><span id="t-total">0:00</span></div>
    </div>
    <canvas id="viz" width="520" height="90"></canvas>
  </div>
  <div id="idle-view" class="idle">
    <div class="big">Waiting for requests…</div>
    <div class="hint">Add a song at <b id="host-hint"></b></div>
  </div>
</div>

<div class="up-next" id="up-next"></div>

<audio id="audio"></audio>

<script>
const API = '/api';
const audio = document.getElementById('audio');

// A per-browser id, generated once and kept in localStorage — invites are
// scoped to whichever session created them (server-side), so a private/
// incognito window genuinely starts with none of another browser's links,
// rather than every open player page sharing one global invite list.
let SESSION_ID = localStorage.getItem('jam_session_id');
if(!SESSION_ID){
  SESSION_ID = (crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(36).slice(2)}`);
  localStorage.setItem('jam_session_id', SESSION_ID);
}
const SESSION_HEADERS = {'X-Jam-Session': SESSION_ID};
(async () => {
  const hint = document.getElementById('host-hint');
  hint.textContent = `${location.hostname}:9998`; // fallback until /config resolves (or if it fails)
  try{
    const r = await fetch(`${API}/config`);
    const d = await r.json();
    if(d.request_page_url) hint.textContent = new URL(d.request_page_url).host;
  }catch(e){}
})();

// ── Volume ───────────────────────────────────────────────────────────────
const volSlider = document.getElementById('vol-slider');
const muteBtn = document.getElementById('mute-btn');
let savedVolume = parseInt(localStorage.getItem('jam_volume') ?? '100', 10);
volSlider.value = savedVolume;
audio.volume = savedVolume / 100;
function updateMuteIcon(){ muteBtn.textContent = (audio.muted || audio.volume === 0) ? '🔇' : (audio.volume < 0.5 ? '🔉' : '🔊'); }
volSlider.addEventListener('input', () => {
  audio.volume = volSlider.value / 100;
  audio.muted = false;
  localStorage.setItem('jam_volume', volSlider.value);
  updateMuteIcon();
});
function toggleMute(){ audio.muted = !audio.muted; updateMuteIcon(); }
updateMuteIcon();

// ── Playback / autoplay unlock ──────────────────────────────────────────
// audio.play() can be blocked by the browser's autoplay policy even after
// a user gesture, depending on browser/OS quirks — rather than fail
// silently (which is exactly what "no sound, no idea why" looks like from
// the outside), show a real button whenever a play() call is rejected so
// there's always a working way to actually start the sound.
function tryPlay(){
  // Defensive: re-attempt resuming the AudioContext on every track change
  // too, not just once at start — if it ever silently stayed suspended,
  // this keeps giving it another chance rather than staying silent forever.
  if(audioCtx && audioCtx.state === 'suspended'){ audioCtx.resume().catch(()=>{}); }
  const p = audio.play();
  const unlock = document.getElementById('audio-unlock');
  if(p && p.then){
    p.then(() => { unlock.style.display = 'none'; })
     .catch(() => { unlock.style.display = 'block'; });
  }
}

// ── Pause (global — one shared jam, same state for everyone watching) ───
// There is exactly one real queue/player; pausing here pauses it for
// every open player page, and the button always reflects the server's
// actual state (polled), not anything tracked locally per-browser.
let jamPaused = false;
function updatePauseIcon(){
  document.getElementById('pause-btn').textContent = jamPaused ? '▶ Play' : '⏸ Pause';
}
function togglePause(){
  fetch(`${API}/player/${jamPaused ? 'resume' : 'pause'}`, {method: 'POST'});
  // Acted on locally right away for a responsive click — the next poll
  // (within ~1s) reconciles this with the real server state regardless,
  // including for every *other* open player page watching the same jam.
  jamPaused = !jamPaused;
  if(jamPaused) audio.pause(); else tryPlay();
  updatePauseIcon();
}

async function startJam(){
  document.getElementById('overlay').style.display = 'none';
  audio.muted = false;
  setupAudioGraph();
  try{ if(audioCtx && audioCtx.state === 'suspended') await audioCtx.resume(); }catch(e){}
  // Fetch + play chained directly from this click (not via a later
  // setTimeout) so the very first real playback is as tightly linked to
  // the user gesture as possible — the safest way to get autoplay allowed.
  try{
    const r = await fetch(`${API}/player/state`);
    const d = await r.json();
    render(d);
  }catch(e){}
  poll();
}

function fmt(s){s=Math.max(0,Math.round(s||0));return`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

let currentId = null;

async function poll(){
  try{
    const r = await fetch(`${API}/player/state`);
    const d = await r.json();
    render(d);
  }catch(e){}
  setTimeout(poll, 1000);
}

function render(d){
  const np = d.now_playing;
  document.getElementById('playing-view').style.display = np ? 'flex' : 'none';
  document.getElementById('idle-view').style.display = np ? 'none' : 'block';
  document.getElementById('skip-btn').style.display = np ? 'block' : 'none';
  document.getElementById('pause-btn').style.display = np ? 'block' : 'none';

  if(np){
    jamPaused = !!d.paused;
    updatePauseIcon();
    if(np.id !== currentId){
      currentId = np.id;
      document.getElementById('art').src = np.thumbnail || '';
      document.getElementById('title').textContent = np.title;
      document.getElementById('artist').textContent = np.artist;
      document.getElementById('req').textContent = `requested by ${np.requested_by}`;
      document.getElementById('t-total').textContent = fmt(np.duration);
      // Seek to wherever the shared timeline already is — this is a fresh
      // <audio> load (new track, or this page just loaded/reloaded mid-
      // track), so without this it would always start over from 0:00.
      const elapsed = d.playback_started_at ? (Date.now()/1000 - d.playback_started_at) : 0;
      audio.src = np.stream_url;
      audio.addEventListener('loadedmetadata', function seekOnce(){
        audio.currentTime = elapsed;
        if(!jamPaused) tryPlay();
      }, {once: true});
    } else if(jamPaused && !audio.paused){
      // Someone else's session (or this one, a moment ago) paused the
      // shared jam — bring this <audio> element in line with that.
      audio.pause();
    } else if(!jamPaused && audio.paused && audio.src){
      tryPlay();
    }

    // While paused, elapsed must stay pinned at the instant pausing
    // happened rather than keep counting up in real time — the server
    // only folds the paused duration into playback_started_at once
    // resumed, so until then, now - playback_started_at would otherwise
    // just keep growing even though nothing is actually still playing.
    const elapsed = (d.paused && d.pause_started_at)
      ? (d.pause_started_at - d.playback_started_at)
      : (d.playback_started_at ? (Date.now()/1000 - d.playback_started_at) : 0);
    const pct = np.duration ? Math.min(100, elapsed/np.duration*100) : 0;
    document.getElementById('bar-fill').style.width = pct + '%';
    document.getElementById('t-elapsed').textContent = fmt(elapsed);
  } else {
    currentId = null;
    jamPaused = false;
    audio.pause();
    audio.removeAttribute('src');
  }

  const un = document.getElementById('up-next');
  un.innerHTML = (d.up_next || []).slice(0, 6).map(i => `
    <div class="un-item">
      <img src="${esc(i.thumbnail)}">
      <div style="min-width:0;flex:1">
        <div class="t">${esc(i.title)}</div>
        ${i.status === 'downloading'
          ? `<div class="dl-bar"><div class="dl-bar-fill" style="width:${Math.max(2, i.progress || 0)}%"></div></div>`
          : `<div class="s">${i.status === 'ready' ? '✅ ready' : '⏳ queued'}</div>`}
      </div>
    </div>`).join('');
}

// expected_id makes this idempotent — with multiple independent sessions
// now possible, more than one could reach 'ended' on the same track around
// the same real moment; the server only actually advances once for it.
function requestAdvance(){
  fetch(`${API}/player/advance`, {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({expected_id: currentId})});
}
audio.addEventListener('ended', requestAdvance);
function skip(){ requestAdvance(); }

// ── Invite links ──────────────────────────────────────────────────────────
function fmtRemaining(expiresAt){
  const s = Math.max(0, Math.round(expiresAt - Date.now()/1000));
  if(s >= 3600) return `${Math.floor(s/3600)}h ${Math.floor((s%3600)/60)}m left`;
  return `${Math.floor(s/60)}m left`;
}

function openInvite(){
  document.getElementById('invite-modal').classList.add('show');
  document.getElementById('im-link-row').style.display = 'none';
  document.getElementById('im-qr-wrap').style.display = 'none';
  refreshInviteList();
}
function closeInvite(){ document.getElementById('invite-modal').classList.remove('show'); }

function showInviteLink(path){
  // location.origin reflects however this page was actually reached —
  // raw :9999, or a reverse-proxied hostname with no port at all.
  const link = `${location.origin}${path}`;
  document.getElementById('im-link').value = link;
  document.getElementById('im-link-row').style.display = 'flex';
  document.getElementById('im-qr').src = `${API}/invite/qr?data=${encodeURIComponent(link)}`;
  document.getElementById('im-qr-wrap').style.display = 'flex';
}

async function generateInvite(){
  const ttl_seconds = parseInt(document.getElementById('ttl-select').value, 10);
  try{
    const r = await fetch(`${API}/invite/create`, {method:'POST',
      headers:{'Content-Type':'application/json', ...SESSION_HEADERS},
      body: JSON.stringify({ttl_seconds})});
    const d = await r.json();
    if(!r.ok){ alert(d.error || 'Could not create link'); return; }
    showInviteLink(d.path);
    refreshInviteList();
  }catch(e){ alert('Failed: ' + e.message); }
}

// Previously generated links only ever showed their link/QR once, right
// after being created — after that they were reduced to a bare truncated
// token in the Active Links list with no way back to the actual link.
function reopenInvite(token){
  showInviteLink(`/invite/${token}`);
}

function copyInvite(){
  const el = document.getElementById('im-link');
  el.select();
  navigator.clipboard?.writeText(el.value).catch(()=>{});
  document.execCommand && document.execCommand('copy');
}

async function refreshInviteList(){
  try{
    const r = await fetch(`${API}/invite/list`, {headers: SESSION_HEADERS});
    const d = await r.json();
    const list = document.getElementById('im-list');
    if(!d.invites || !d.invites.length){ list.innerHTML = '<div class="im-empty">None yet</div>'; return; }
    list.innerHTML = d.invites.map(inv => `
      <div class="im-item">
        <span class="exp">…${esc(inv.token.slice(-6))} · ${fmtRemaining(inv.expires_at)}</span>
        <button class="im-reopen" onclick="reopenInvite('${inv.token}')" title="Show link &amp; QR again">🔗</button>
        <button class="im-revoke" onclick="revokeInvite('${inv.token}')" title="Revoke">✕</button>
      </div>`).join('');
  }catch(e){}
}

async function revokeInvite(token){
  await fetch(`${API}/invite/${token}/revoke`, {method:'POST', headers: SESSION_HEADERS});
  refreshInviteList();
}

// ── Visualizer ───────────────────────────────────────────────────────────
// createMediaElementSource irreversibly reroutes the <audio> element's
// output through the Web Audio graph the moment it's called — there's no
// going back to plain <audio> output afterward for this element. The
// previous version chained source -> analyser -> destination as one
// sequence, so if the analyser step failed for any reason, play() would
// still resolve "successfully" while the actual sound output was left
// dangling with nowhere to go: silent, with no visible error anywhere.
//
// Fixed topology: connect source -> destination FIRST, on its own, as the
// one connection that actually has to work for sound to exist. The
// analyser is a separate, parallel tap off the same source — it only needs
// to *receive* audio to answer getByteFrequencyData(), not to also be
// wired into the output path — so if setting it up fails, sound is
// completely unaffected either way.
let audioCtx = null, analyser = null, freqData = null;
function setupAudioGraph(){
  if(audioCtx) return;
  let source;
  try{
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    source = audioCtx.createMediaElementSource(audio);
    source.connect(audioCtx.destination);
  }catch(e){
    console.warn('[jam] Web Audio unavailable — falling back to plain <audio> output:', e);
    audioCtx = null;
    return;
  }
  try{
    analyser = audioCtx.createAnalyser();
    // 2048 gives 1024 underlying frequency bins — plenty of raw resolution
    // to bucket log-scale below, versus the 64 bins used previously (that
    // was fine for a linear sweep, but a log scale needs real resolution
    // to draw from in the upper octaves).
    analyser.fftSize = 2048;
    // getByteFrequencyData maps [minDecibels, maxDecibels] linearly onto
    // 0-255. The Web Audio defaults (-100 to -30 dBFS) put "max height" at
    // a level normal music clears constantly, even in its quiet passages
    // — bars end up looking near-maxed almost all the time regardless of
    // how loud the track actually is. Widening this range gives quiet
    // moments genuinely short bars and reserves tall ones for genuinely
    // loud moments.
    analyser.minDecibels = -90;
    analyser.maxDecibels = -10;
    source.connect(analyser);
    freqData = new Uint8Array(analyser.frequencyBinCount);
    barBins = computeBarBins();
    requestAnimationFrame(drawVisualizer);
  }catch(e){
    console.warn('[jam] visualizer unavailable:', e);
    analyser = null;
  }
}

// Real spectrum analyzers (audioMotion — the library Feishin's own
// visualizer is built on — included, log scale is its documented default
// "recommended for musical applications") space bars by musical
// octave/tone, not by raw linear FFT bin — a linear layout crams almost
// all the visually-interesting range into the first few bars, since bass
// dominates a linear frequency axis, leaving everything above a couple
// kHz nearly flat. Log spacing is what makes a spectrum analyzer look
// like it's actually responding to the music's actual pitches rather
// than just its bass line.
const VIZ_BAR_COUNT = 48, VIZ_MIN_FREQ = 40, VIZ_MAX_FREQ = 14000;
let barBins = null; // per bar: [firstBinIndex, lastBinIndex] to max() over

function computeBarBins(){
  const sampleRate = audioCtx.sampleRate;
  const n = analyser.fftSize;
  const maxFreq = Math.min(VIZ_MAX_FREQ, sampleRate / 2);
  const freqToBin = f => Math.min(freqData.length - 1, Math.max(0, Math.round(f * n / sampleRate)));
  const bins = [];
  let prevBin = freqToBin(VIZ_MIN_FREQ);
  for(let j = 1; j <= VIZ_BAR_COUNT; j++){
    const freq = VIZ_MIN_FREQ * Math.pow(maxFreq / VIZ_MIN_FREQ, j / VIZ_BAR_COUNT);
    const bin = Math.max(prevBin + 1, freqToBin(freq));
    bins.push([prevBin, bin]);
    prevBin = bin;
  }
  return bins;
}

// Peak-hold caps (rise instantly, fall slowly under "gravity") and a
// fading reflection below the baseline are the two most recognizable
// signature touches of the classic hi-fi/audioMotion-style spectrum
// analyzer look (the same style Feishin's own visualizer is built on) —
// a plain bar sweep reads as a generic bar chart without them.
let peaks = null;

function drawVisualizer(){
  requestAnimationFrame(drawVisualizer);
  const canvas = document.getElementById('viz');
  if(!analyser || !canvas || canvas.offsetParent === null) return;
  analyser.getByteFrequencyData(freqData);
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0, 0, w, h);

  if(!barBins) barBins = computeBarBins();
  const count = barBins.length;
  if(!peaks || peaks.length !== count) peaks = new Float32Array(count);
  const barWidth = w / count;
  const bw = Math.max(1, barWidth - 1);
  const baseline = h * 0.62;   // bars occupy the top ~62%...
  const reflH = h - baseline;  // ...and fade into a reflection below
  // getByteFrequencyData's minDecibels/maxDecibels span is wide (needs to
  // be, to give quiet vs. loud PARTS OF A TRACK a real visual difference
  // at a fixed volume) — 80dB of range means a volume-slider change alone
  // barely moves a reading within it, so at half volume the bars still
  // read almost as "loud" as at full volume. Scaling explicitly by the
  // actual volume level (post-mute) guarantees the displayed range
  // actually spans quiet-to-loud across the volume slider too, not just
  // within whatever a single volume setting's own dynamics look like.
  const volScale = audio.muted ? 0 : audio.volume;

  for(let j = 0; j < count; j++){
    const [from, to] = barBins[j];
    let peak = 0;
    for(let i = from; i < to; i++) if(freqData[i] > peak) peak = freqData[i];
    const barHeight = (peak / 255) * baseline * volScale;
    peaks[j] = Math.max(barHeight, peaks[j] - baseline * 0.02); // gravity

    const x = j * barWidth;
    const grad = ctx.createLinearGradient(0, baseline - barHeight, 0, baseline);
    grad.addColorStop(0, '#1ed760');
    grad.addColorStop(1, '#8b5cf6');
    ctx.fillStyle = grad;
    ctx.beginPath();
    if(ctx.roundRect) ctx.roundRect(x, baseline - barHeight, bw, barHeight, [2, 2, 0, 0]);
    else ctx.rect(x, baseline - barHeight, bw, barHeight);
    ctx.fill();

    // Peak-hold cap
    ctx.fillStyle = 'rgba(255,255,255,.85)';
    ctx.fillRect(x, baseline - peaks[j] - 2, bw, 2);

    // Reflection: same bar mirrored below the baseline, fading out
    const rh = Math.min(barHeight, reflH);
    const rGrad = ctx.createLinearGradient(0, baseline, 0, baseline + rh);
    rGrad.addColorStop(0, 'rgba(30,215,96,.28)');
    rGrad.addColorStop(1, 'rgba(139,92,246,0)');
    ctx.fillStyle = rGrad;
    ctx.fillRect(x, baseline, bw, rh);
  }
}
</script>
